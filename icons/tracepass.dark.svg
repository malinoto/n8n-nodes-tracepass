<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" role="img" aria-label="TracePass">
  <title>TracePass</title>
  <defs>
    <!--
      Dark-theme variant: card is a flat near-black (n8n dark theme
      already uses #1F2937 surfaces, so the icon sits cleanly on it
      without the gradient drawing attention away). Glyph carries
      the brand orange so the pixel grid still reads as "TracePass"
      and not as a generic monochrome mark.
    -->
    <linearGradient id="tpGlyphDark" x1="0" y1="0" x2="30" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="60" height="60" rx="12" fill="#1F2937"/>
  <svg x="9" y="14" width="42" height="28" viewBox="0 0 30 20">
    <!-- T -->
    <rect x="0"  y="0"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="4"  y="0"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="8"  y="0"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="4"  y="4"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="4"  y="8"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="4"  y="12" width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="4"  y="16" width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <!-- P -->
    <rect x="15" y="0"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="15" y="4"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="15" y="8"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="15" y="12" width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="15" y="16" width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="19" y="0"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="23" y="0"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="27" y="0"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="27" y="4"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="27" y="8"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="19" y="8"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
    <rect x="23" y="8"  width="3" height="3" fill="url(#tpGlyphDark)" rx="0.5"/>
  </svg>
</svg>
