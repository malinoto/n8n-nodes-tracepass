# Lints and builds on every push and pull request.
#
# WHY: the publish workflow only runs on a `v*.*.*` tag, so an external pull
# request previously got no automated feedback at all and a broken build was only
# discovered at release time. CONTRIBUTING.md asks contributors to run these
# locally; this makes that verifiable rather than trusted.
#
# The n8n linter is not cosmetic here — it enforces structural rules the node
# depends on (alphabetical operation options, display-name conventions), so a
# lint failure is a real defect, not style noise.
#
# Deliberately NOT a release path: no publish step, `contents: read` only, so a
# fork PR can run this safely.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the `engines.node` floor in package.json (>=20.15).
          node-version: 20
          cache: npm

      # `--ignore-scripts` skips native postinstall builds. Needed because
      # `isolated-vm` arrives transitively (n8n-workflow → @n8n/expression-runtime)
      # and its C++ fails to compile against the V8 headers on current Node 20.x
      # runners. It is n8n's expression sandbox — irrelevant to linting or building
      # this node, and this package ships ZERO runtime dependencies, so nothing it
      # provides can reach a user. Locally the failure is invisible because the
      # compiled binary is already cached.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
