# Lints and builds on every push and pull request.
#
# WHY: the publish workflow only runs on a `v*.*.*` tag, so an external pull
# request previously got no automated feedback at all and a broken build was only
# discovered at release time. CONTRIBUTING.md asks contributors to run these
# locally; this makes that verifiable rather than trusted.
#
# The n8n linter is not cosmetic here — it enforces structural rules the node
# depends on (alphabetical operation options, display-name conventions), so a
# lint failure is a real defect, not style noise.
#
# Deliberately NOT a release path: no publish step, `contents: read` only, so a
# fork PR can run this safely.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # `lts/*`, matching the publish workflow — NOT this package's own
          # `engines.node` floor of 20.15.
          #
          # The floor describes what a CONSUMER needs to run the published node
          # (which has zero runtime dependencies). The BUILD needs whatever the dev
          # dependency tree demands, and that is higher: `isolated-vm` (pulled in
          # transitively by n8n-workflow → @n8n/expression-runtime) declares
          # `engines: node >=22` and ships prebuilt binaries only for newer ABIs.
          # On Node 20 there is no prebuild, so npm compiles it from source against
          # a V8 it does not match, and the install dies with
          # "marked 'final', but is not virtual".
          #
          # Pinning 20 here is what broke the first CI run. Don't "align" this back
          # to engines.node — the two numbers answer different questions.
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
